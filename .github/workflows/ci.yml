name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0

jobs:
  backend:
    name: Backend (lint, types, tests, boundaries, audit)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: fcp
          POSTGRES_USER: fcp
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fcp -d fcp" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      # Throwaway CI-only credentials for an ephemeral service container.
      POSTGRES_OWNER_USER: fcp_owner
      POSTGRES_OWNER_PASSWORD: ci-only-owner
      POSTGRES_APP_USER: fcp_app
      # Document vault (M2-4): throwaway CI-only keys for an ephemeral SeaweedFS, and ClamAV.
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_ACCESS_KEY: ci-only-access-key
      S3_SECRET_KEY: ci-only-secret-key
      CLAMD_HOST: 127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start object storage (SeaweedFS) and antivirus (ClamAV) for the document tests
        working-directory: .
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 -e S3_ACCESS_KEY -e S3_SECRET_KEY \
            -v "$PWD/infra/local/seaweedfs-entrypoint.sh:/fcp/seaweedfs-entrypoint.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.52 /fcp/seaweedfs-entrypoint.sh
          docker run -d --name clamav -p 127.0.0.1:3310:3310 -e CLAMAV_NO_FRESHCLAMD=true \
            clamav/clamav:1.4.3
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Create database roles (non-superuser owner and runtime roles)
        run: >-
          PGPASSWORD=ci-only-throwaway psql -h 127.0.0.1 -U fcp -d fcp -v ON_ERROR_STOP=1
          -v owner_password=ci-only-owner -v app_password=ci-only-app -v db_name=fcp
          -f ../scripts/db/create_roles.sql
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: Module boundary contracts
        run: uv run lint-imports --no-cache
      - name: No floating point in domain code
        run: uv run python -m tools.fcp_lint.no_float
      - name: Migrations are up to date with the models
        run: DJANGO_SETTINGS_MODULE=fcp.settings.test uv run python manage.py makemigrations --check --dry-run
      - name: Published OpenAPI document is up to date (AC-G3)
        run: DJANGO_SETTINGS_MODULE=fcp.settings.test uv run python -m fcp.openapi --check ../docs/api/openapi.json
      - name: Wait for object storage and antivirus
        working-directory: .
        run: |
          for i in $(seq 1 90); do
            curl -s -o /dev/null http://127.0.0.1:8333 && docker exec clamav clamdcheck.sh >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs clamav | tail -20; docker logs s3 | tail -20; exit 1
      - name: Tests with coverage gate
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Money library requires 100% branch coverage (AC-M0-7)
        run: uv run coverage report --include='*/fcp/core/money/*' --fail-under=100
      - name: Dependency audit
        run: uv run pip-audit --skip-editable

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (high and critical block)
        run: pnpm audit --audit-level high

  security:
    name: Security scans (Semgrep, gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semgrep (project rules)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --config .semgrep/ --error --metrics=off backend/src backend/tools
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --no-banner -c /repo/.gitleaks.toml --redact

  infrastructure:
    name: Infrastructure as code (fmt, validate, tflint, checkov; never applied)
    runs-on: ubuntu-24.04
    env:
      TF_IMAGE: hashicorp/terraform:1.17.1
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.65.0
      CHECKOV_IMAGE: bridgecrew/checkov:3.4.3
    steps:
      - uses: actions/checkout@v4
      - name: No apply path exists (AC-M0-6)
        run: |
          if grep -rnE '(terraform|tofu)[^#]*[[:space:]](apply|destroy|import)([[:space:]]|$)' \
              .github scripts Makefile; then
            echo "A terraform apply/destroy/import path was found; it requires explicit approval."
            exit 1
          fi
      - name: terraform fmt
        run: docker run --rm -v "$PWD:/repo" "$TF_IMAGE" -chdir=/repo/infra/terraform fmt -check -recursive -diff
      - name: terraform init (no backend) and validate
        run: |
          for env in infra/terraform/envs/*/; do
            docker run --rm -v "$PWD:/repo" -e TF_IN_AUTOMATION=1 "$TF_IMAGE" \
              -chdir="/repo/$env" init -backend=false -input=false -lockfile=readonly
            docker run --rm -v "$PWD:/repo" -e TF_IN_AUTOMATION=1 "$TF_IMAGE" -chdir="/repo/$env" validate
          done
      - name: tflint
        run: >-
          docker run --rm -v "$PWD/infra/terraform:/data" -w /data "$TFLINT_IMAGE"
          --recursive --config /data/.tflint.hcl
      - name: checkov
        run: >-
          docker run --rm -v "$PWD/infra/terraform:/tf" "$CHECKOV_IMAGE"
          -d /tf --framework terraform --quiet --compact --skip-path .terraform

  containers:
    name: Container images (build, checkov, production-like smoke; never pushed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile policy (checkov)
        run: >-
          docker run --rm -v "$PWD:/src" bridgecrew/checkov:3.4.3
          -f /src/backend/Dockerfile -f /src/frontend/Dockerfile --framework dockerfile --quiet --compact
      - name: Build the API image
        run: docker build -t fcp-backend:ci backend/
      - name: Build the web image
        run: docker build -t fcp-web:ci frontend/
      - name: Production-like smoke test (TLS database, migration task, read-only, non-root)
        run: scripts/ci/container-smoke.sh fcp-backend:ci fcp-web:ci

  prove-gates:
    name: Prove gates reject violations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
        working-directory: backend
      - run: scripts/ci/prove-gates.sh
