[project]
name = "fcp-backend"
version = "0.0.0"
description = "Financial Compliance Platform backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "authlib>=1.9,<2",
    "django>=5.2,<5.3",
    "django-ninja>=1.7,<2",
    "gunicorn>=23,<24",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "reportlab>=4.2,<5",
    "requests>=2.34,<3",
    "structlog>=25,<27",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fcp"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fcp.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "DTZ", "T20", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
# Keyword-only parameters are fine; six keeps signatures readable.
max-args = 6

[tool.ruff.lint.isort]
known-first-party = ["fcp", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]
"**/migrations/*.py" = ["RUF012", "E501"]
"**/models.py" = ["RUF012"]

[tool.importlinter]
root_package = "fcp"
contract_types = ["public_api: tools.fcp_lint.importlinter_contracts.PublicApiContract"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Modules import each other only through their public api.py"
type = "public_api"
modules_root = "fcp.modules"

[[tool.importlinter.contracts]]
name = "The shared kernel (fcp.core) never depends on modules"
type = "forbidden"
source_modules = ["fcp.core"]
forbidden_modules = ["fcp.modules"]

[[tool.importlinter.contracts]]
name = "Application code never imports developer tooling (fcp.devtools)"
type = "forbidden"
source_modules = ["fcp.core", "fcp.modules", "fcp.settings", "fcp.urls"]
forbidden_modules = ["fcp.devtools"]

[[tool.importlinter.contracts]]
name = "Planning modules never import the ledger directly (ADR-0007: read actuals via reporting)"
type = "forbidden"
source_modules = [
    "fcp.modules.metrics", "fcp.modules.cashflow", "fcp.modules.budgeting",
    "fcp.modules.projections", "fcp.modules.kpi", "fcp.modules.goals",
    "fcp.modules.scenarios", "fcp.modules.mgmt_reporting", "fcp.modules.dashboards",
]
forbidden_modules = ["fcp.modules.ledger"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The AI client never imports the ledger (ADR-0005: no write path)"
type = "forbidden"
source_modules = ["fcp.modules.ai"]
forbidden_modules = ["fcp.modules.ledger"]
allow_indirect_imports = true

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "tools"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# Migrations are declarative Django boilerplate (largely generated).
module = ["fcp.*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Authlib ships no type information; its use is confined to fcp.modules.identity.
module = ["authlib.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "fcp.settings.test"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "hypothesis>=6.170.14",
    "import-linter>=2.15,<3",
    "mypy>=1.15",
    "pip-audit>=2.10,<3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "responses>=0.26,<1",
    "ruff>=0.17.3",
    "types-openpyxl>=3.1.5.20261017",
    "types-reportlab>=5.0.0.20261008",
    "types-requests>=2.33.0.20261030",
]

[tool.coverage.run]
branch = true
source = ["fcp"]
omit = ["*/fcp/wsgi.py", "*/fcp/asgi.py", "*/fcp/settings/dev.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
