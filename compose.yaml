# Local development services only. Never used for any deployed environment.
# All ports bind to 127.0.0.1. Credentials come from .env (generated by `make dev-env`).
name: fcp

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./infra/local/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro"
      - "./scripts/db/create_roles.sql:/fcp/create_roles.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      FCP_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/local/keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  objectstore:
    # SeaweedFS (Apache-2.0) provides an S3-compatible API for local development.
    image: chrislusf/seaweedfs:4.52
    entrypoint: ["/bin/sh", "/fcp/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - "s3data:/data"
      - "./infra/local/seaweedfs-entrypoint.sh:/fcp/seaweedfs-entrypoint.sh:ro"

  mail:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  s3data:
